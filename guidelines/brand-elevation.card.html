<!-- @dsCard group="Brand" viewport="700x160" name="Elevation" subtitle="Green-tinted, low, never stacked — level 1 is the ceiling for resting cards" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)">
<div><div style="height:66px;border-radius:var(--card-radius);border:1px solid var(--surface-border);background:var(--card);box-shadow:none"></div><div class="n">level 0</div><div class="v">canvas</div></div><div><div style="height:66px;border-radius:var(--card-radius);border:1px solid var(--surface-border);background:var(--card);box-shadow:var(--shadow-1)"></div><div class="n">level 1</div><div class="v">card</div></div><div><div style="height:66px;border-radius:var(--card-radius);border:1px solid var(--surface-border);background:var(--card);box-shadow:var(--shadow-2)"></div><div class="n">level 2</div><div class="v">popover</div></div><div><div style="height:66px;border-radius:var(--card-radius);border:1px solid var(--surface-border);background:var(--card);box-shadow:var(--shadow-3)"></div><div class="n">level 3</div><div class="v">drawer / modal</div></div><div><div style="height:66px;border-radius:var(--card-radius);border:1px solid var(--surface-border);background:var(--card);box-shadow:var(--shadow-4)"></div><div class="n">level 4</div><div class="v">floating</div></div>
</div></body></html>
