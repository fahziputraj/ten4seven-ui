<!-- @dsCard group="Colors" viewport="700x140" name="Neutral ramp" subtitle="Near-pure grey for surfaces and borders, shifting green at the dark end" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:repeat(8,1fr)">
<div><div class="sw" style="height:56px;background:var(--neutral-50)"></div><div class="n">50</div><div class="v">98%</div></div>
<div><div class="sw" style="height:56px;background:var(--neutral-100)"></div><div class="n">100</div><div class="v">96%</div></div>
<div><div class="sw" style="height:56px;background:var(--neutral-150)"></div><div class="n">150</div><div class="v">94%</div></div>
<div><div class="sw" style="height:56px;background:var(--neutral-200)"></div><div class="n">200</div><div class="v">88%</div></div>
<div><div class="sw" style="height:56px;background:var(--neutral-300)"></div><div class="n">300</div><div class="v">84%</div></div>
<div><div class="sw" style="height:56px;background:var(--neutral-500)"></div><div class="n">500</div><div class="v">145 8% 43%</div></div>
<div><div class="sw" style="height:56px;background:var(--neutral-700)"></div><div class="n">700</div><div class="v">145 14% 26%</div></div>
<div><div class="sw" style="height:56px;background:var(--neutral-900)"></div><div class="n">900</div><div class="v">145 29% 18%</div></div>
</div></body></html>
