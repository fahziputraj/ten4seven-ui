<!-- @dsCard group="Brand" viewport="700x190" name="Imagery & scrim" subtitle="Bottom-up green scrim over farm photography — never a flat black overlay" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:1.3fr 1fr">
<div style="position:relative;height:150px;border-radius:var(--radius-panel);overflow:hidden;background:var(--aapm-green-800)">
<div style="position:absolute;inset:0;background:var(--scrim-photo)"></div>
<div style="position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);height:78px;width:78px;border-radius:99px;background:hsl(var(--brand-foreground-hsl) / .5);filter:blur(28px)"></div>
<img src="../assets/logos/aapm-icon-dark.svg" alt="" style="position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);height:52px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.76))">
<div style="position:absolute;inset:auto 0 0 0;padding:14px;text-align:center;color:#fff;font-family:Georgia,serif;font-style:italic;font-size:13px;line-height:1.4;text-shadow:0 3px 24px rgba(0,0,0,.55)">"Performa farm yang sehat dimulai dari kemampuan membaca sinyal."</div>
</div>
<div style="height:150px;border-radius:var(--radius-panel);background:linear-gradient(160deg,var(--hero-start),var(--hero-end));display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff">
<div style="font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;opacity:.75">Hero gradient</div>
<div style="font-size:var(--text-lg);font-weight:600;letter-spacing:var(--tracking-title)">green-700 → green-900</div>
<div style="margin-top:6px;height:2px;width:40px;background:var(--hero-accent)"></div>
</div>
</div></body></html>
