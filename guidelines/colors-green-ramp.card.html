<!-- @dsCard group="Colors" viewport="700x140" name="Green ramp" subtitle="700 is the brand action; 800–950 are for hero gradients and photo scrims only" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)">
<div><div class="sw" style="height:56px;background:var(--aapm-green-100)"></div><div class="n">green-100</div><div class="v">surface wash</div></div>
<div><div class="sw" style="height:56px;background:var(--aapm-green-700)"></div><div class="n">green-700</div><div class="v">primary action</div></div>
<div><div class="sw" style="height:56px;background:var(--aapm-green-800)"></div><div class="n">green-800</div><div class="v">hero start</div></div>
<div><div class="sw" style="height:56px;background:var(--aapm-green-900)"></div><div class="n">green-900</div><div class="v">hero end</div></div>
<div><div class="sw" style="height:56px;background:var(--aapm-green-950)"></div><div class="n">green-950</div><div class="v">scrim / overlay</div></div>
</div></body></html>
