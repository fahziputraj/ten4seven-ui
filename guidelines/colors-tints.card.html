<!-- @dsCard group="Colors" viewport="700x150" name="Tint families" subtitle="Six washes, each with a matching foreground and border — for category coding and tiles" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)">
<div><div class="sw" style="height:62px;background:var(--tint-green);border-color:var(--tint-green-border);display:flex;align-items:center;justify-content:center;color:var(--tint-green-foreground);font-weight:600;font-size:var(--text-sm)">Aa</div><div class="n">tint-green</div></div><div><div class="sw" style="height:62px;background:var(--tint-lime);border-color:var(--tint-lime-border);display:flex;align-items:center;justify-content:center;color:var(--tint-lime-foreground);font-weight:600;font-size:var(--text-sm)">Aa</div><div class="n">tint-lime</div></div><div><div class="sw" style="height:62px;background:var(--tint-orange);border-color:var(--tint-orange-border);display:flex;align-items:center;justify-content:center;color:var(--tint-orange-foreground);font-weight:600;font-size:var(--text-sm)">Aa</div><div class="n">tint-orange</div></div><div><div class="sw" style="height:62px;background:var(--tint-blue);border-color:var(--tint-blue-border);display:flex;align-items:center;justify-content:center;color:var(--tint-blue-foreground);font-weight:600;font-size:var(--text-sm)">Aa</div><div class="n">tint-blue</div></div><div><div class="sw" style="height:62px;background:var(--tint-violet);border-color:var(--tint-violet-border);display:flex;align-items:center;justify-content:center;color:var(--tint-violet-foreground);font-weight:600;font-size:var(--text-sm)">Aa</div><div class="n">tint-violet</div></div><div><div class="sw" style="height:62px;background:var(--tint-slate);border-color:var(--tint-slate-border);display:flex;align-items:center;justify-content:center;color:var(--tint-slate-foreground);font-weight:600;font-size:var(--text-sm)">Aa</div><div class="n">tint-slate</div></div>
</div></body></html>
