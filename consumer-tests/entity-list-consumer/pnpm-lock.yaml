lockfileVersion: "9.0"

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:
  .:
    dependencies:
      "@ten4seven/agent":
        specifier: file:../../packages/agent
        version: file:../../packages/agent
      "@ten4seven/icons":
        specifier: file:../../packages/icons
        version: file:../../packages/icons(react@19.2.8)
      "@ten4seven/tokens":
        specifier: file:../../packages/tokens
        version: file:../../packages/tokens
      "@ten4seven/ui":
        specifier: file:../../packages/ui
        version: file:../../packages/ui(react-dom@19.2.8(react@19.2.8))(react@19.2.8)

packages:
  "@ten4seven/agent@file:../../packages/agent":
    resolution: { directory: ../../packages/agent, type: directory }

  "@ten4seven/contracts@file:../../packages/contracts":
    resolution: { directory: ../../packages/contracts, type: directory }

  "@ten4seven/icons@file:../../packages/icons":
    resolution: { directory: ../../packages/icons, type: directory }
    peerDependencies:
      react: ">=18"

  "@ten4seven/tokens@file:../../packages/tokens":
    resolution: { directory: ../../packages/tokens, type: directory }

  "@ten4seven/ui@file:../../packages/ui":
    resolution: { directory: ../../packages/ui, type: directory }
    peerDependencies:
      react: ">=18.2.0"
      react-dom: ">=18.2.0"

  react-dom@19.2.8:
    resolution:
      {
        integrity: sha512-rVprimfGBG3DR+Tq0IQG2DT5PxKth1WIGDmj5yPmlzr4YBe7uyE+Du4oVqTDXZSHGGGXRtTJEGSSePyQCMBglQ==,
      }
    peerDependencies:
      react: ^19.2.8

  react@19.2.8:
    resolution:
      {
        integrity: sha512-PWaYA1L/q9u2u7xYQi+Y3L3Yfnie7XyLeaJICV1MGD6LprsBxcAqGjYyr0eY3p+QdsA+x/Irkt4Qif8D63+Sbw==,
      }
    engines: { node: ">=0.10.0" }

  scheduler@0.27.0:
    resolution:
      {
        integrity: sha512-eNv+WrVbKu1f3vbYJT/xtiF5syA5HPIMtf9IgY/nKg0sWqzAUEvqY/xm7OcZc/qafLx/iO9FgOmeSAp4v5ti/Q==,
      }

snapshots:
  "@ten4seven/agent@file:../../packages/agent":
    dependencies:
      "@ten4seven/contracts": file:../../packages/contracts

  "@ten4seven/contracts@file:../../packages/contracts": {}

  "@ten4seven/icons@file:../../packages/icons(react@19.2.8)":
    dependencies:
      react: 19.2.8

  "@ten4seven/tokens@file:../../packages/tokens": {}

  "@ten4seven/ui@file:../../packages/ui(react-dom@19.2.8(react@19.2.8))(react@19.2.8)":
    dependencies:
      react: 19.2.8
      react-dom: 19.2.8(react@19.2.8)

  react-dom@19.2.8(react@19.2.8):
    dependencies:
      react: 19.2.8
      scheduler: 0.27.0

  react@19.2.8: {}

  scheduler@0.27.0: {}
