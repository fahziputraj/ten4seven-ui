<!-- @dsCard group="Brand" viewport="700x200" name="Card treatments" subtitle="20px radius, 1px border, green double shadow — plus the top accent rule and tinted advisory card" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:repeat(3,1fr)">
<div style="position:relative;overflow:hidden;border-radius:var(--card-radius);border:1px solid var(--surface-border);background:var(--card);box-shadow:var(--card-shadow);padding:16px">
<span style="position:absolute;inset:0 0 auto 0;height:1px;background:var(--brand-lime)"></span>
<div style="font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--brand-green)">Lanjutkan belajar</div>
<div style="margin-top:8px;font-size:var(--text-base);font-weight:600">Manajemen pakan layer</div>
<div class="n">accent rule on top edge</div></div>
<div style="border-radius:var(--card-radius);border:1px solid var(--tint-green-border);background:var(--tint-green);padding:16px">
<div style="font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--tint-green-foreground)">Study note</div>
<div style="margin-top:8px;font-size:var(--text-base);line-height:1.25rem">Gunakan satu sesi untuk satu keputusan operasional.</div>
<div class="n">tinted advisory · no shadow</div></div>
<div style="border-radius:var(--card-radius);border:1px dashed var(--border);background:var(--surface-subtle);padding:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
<div style="font-size:var(--text-base);color:var(--muted-foreground)">Belum ada rekomendasi</div>
<div class="n">dashed · nothing here yet</div></div>
</div></body></html>
