<!doctype html><html lang="id"><head><meta charset="utf-8"><title>AAPM ERP — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}a{color:var(--brand-green)}a:hover{color:var(--aapm-green-800)}button{font-family:inherit}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./erpData.js"></script>
<script type="text/babel" src="./ErpShell.jsx"></script>
<script type="text/babel" src="./OperationalDashboard.jsx"></script>
<script type="text/babel" src="./InvoiceListPage.jsx"></script>
<script type="text/babel" src="./TransactionPage.jsx"></script>
<script type="text/babel" src="./ApprovalQueuePage.jsx"></script>
<script type="text/babel" data-presets="react">
const { StateView } = window.AAPMDesignSystem_07e1a3;
function App() {
  const [view, setView] = React.useState("dashboard");
  return (
    <window.ErpShell view={view} onNavigate={setView}>
      {view === "dashboard" && <window.OperationalDashboard onOpenList={() => setView("list")} onOpenApproval={() => setView("approval")} />}
      {view === "list" && <window.InvoiceListPage onOpenRecord={() => setView("transaction")} />}
      {view === "transaction" && <window.TransactionPage onBack={() => setView("list")} />}
      {view === "approval" && <window.ApprovalQueuePage />}
      {!["dashboard","list","transaction","approval"].includes(view) && (
        <StateView state="empty" title="Modul ini belum dirancang"
          description="Tidak ada sumber desain atau kode ERP yang diberikan untuk modul ini. Empat layar kanonik yang tersedia — Operational Dashboard, List Page, Master-Detail Transaction dan Approval Queue — adalah pola yang harus diikuti saat modul ini dibangun." />
      )}
    </window.ErpShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
