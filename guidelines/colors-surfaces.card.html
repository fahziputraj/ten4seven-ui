<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="The grey vocabulary product code picks from instead of inventing values" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)">
<div><div class="sw" style="height:58px;background:var(--background)"></div><div class="n">background</div><div class="v">canvas</div></div>
<div><div class="sw" style="height:58px;background:var(--surface-subtle)"></div><div class="n">surface-subtle</div><div class="v">98%</div></div>
<div><div class="sw" style="height:58px;background:var(--surface-muted)"></div><div class="n">surface-muted</div><div class="v">96%</div></div>
<div><div class="sw" style="height:58px;background:var(--surface-inset)"></div><div class="n">surface-inset</div><div class="v">94%</div></div>
<div><div class="sw" style="height:58px;background:var(--surface-accent)"></div><div class="n">surface-accent</div><div class="v">green wash</div></div>
<div><div class="sw" style="height:58px;background:var(--sidebar-background)"></div><div class="n">sidebar-bg</div><div class="v">98%</div></div>
</div></body></html>
