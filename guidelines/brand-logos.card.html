<!-- @dsCard group="Brand" viewport="700x180" name="Logo lockups" subtitle="AAPM corporate and Layer Academy marks, light and dark variants" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:1fr 1fr">
<div style="padding:18px;border-radius:var(--radius-panel);border:1px solid var(--surface-border);background:var(--card);display:flex;align-items:center;gap:22px;justify-content:center">
<img src="../assets/logos/aapm-logo.svg" alt="AAPM" style="height:44px"><img src="../assets/logos/academy-logo.svg" alt="AAPM Layer Academy" style="height:44px">
</div>
<div style="padding:18px;border-radius:var(--radius-panel);background:var(--aapm-green-900);display:flex;align-items:center;gap:22px;justify-content:center">
<img src="../assets/logos/aapm-logo-dark.svg" alt="AAPM" style="height:44px"><img src="../assets/logos/academy-logo-dark.svg" alt="AAPM Layer Academy" style="height:44px">
</div>
</div>
<div class="f" style="margin-top:10px;align-items:center;gap:14px">
<img src="../assets/logos/aapm-icon.svg" alt="" style="height:34px"><img src="../assets/logos/academy-icon.svg" alt="" style="height:34px"><img src="../assets/logos/aapm-app-icon.svg" alt="" style="height:34px"><img src="../assets/logos/academy-app-icon.svg" alt="" style="height:34px">
<span class="n" style="margin:0">icon · app-icon variants</span>
</div></body></html>
