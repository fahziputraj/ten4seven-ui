<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="f" style="align-items:flex-end;height:78px;gap:10px">
<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:62px;background:var(--chart-1);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:44px;background:var(--chart-2);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:74px;background:var(--chart-3);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:30px;background:var(--chart-4);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:52px;background:var(--chart-5);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div></div>
</div>
<div class="g" style="grid-template-columns:repeat(5,1fr);margin-top:8px">
<div class="n" style="display:flex;align-items:center;gap:5px;margin:0"><span style="height:8px;width:8px;border-radius:2px;background:var(--chart-1)"></span>chart-1</div><div class="n" style="display:flex;align-items:center;gap:5px;margin:0"><span style="height:8px;width:8px;border-radius:2px;background:var(--chart-2)"></span>chart-2</div><div class="n" style="display:flex;align-items:center;gap:5px;margin:0"><span style="height:8px;width:8px;border-radius:2px;background:var(--chart-3)"></span>chart-3</div><div class="n" style="display:flex;align-items:center;gap:5px;margin:0"><span style="height:8px;width:8px;border-radius:2px;background:var(--chart-4)"></span>chart-4</div><div class="n" style="display:flex;align-items:center;gap:5px;margin:0"><span style="height:8px;width:8px;border-radius:2px;background:var(--chart-5)"></span>chart-5</div>
</div></body></html>
