<!-- @dsCard group="Spacing" viewport="700x130" name="Space scale" subtitle="4 / 8 rhythm, ten steps" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="f" style="align-items:flex-end">
<div style="text-align:center"><div style="width:4px;height:4px;background:var(--brand-green);opacity:.85;border-radius:3px"></div><div class="n" style="margin-top:6px">4</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--brand-green);opacity:.85;border-radius:3px"></div><div class="n" style="margin-top:6px">8</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--brand-green);opacity:.85;border-radius:3px"></div><div class="n" style="margin-top:6px">12</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--brand-green);opacity:.85;border-radius:3px"></div><div class="n" style="margin-top:6px">16</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--brand-green);opacity:.85;border-radius:3px"></div><div class="n" style="margin-top:6px">20</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--brand-green);opacity:.85;border-radius:3px"></div><div class="n" style="margin-top:6px">24</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--brand-green);opacity:.85;border-radius:3px"></div><div class="n" style="margin-top:6px">32</div></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--brand-green);opacity:.85;border-radius:3px"></div><div class="n" style="margin-top:6px">40</div></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--brand-green);opacity:.85;border-radius:3px"></div><div class="n" style="margin-top:6px">48</div></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--brand-green);opacity:.85;border-radius:3px"></div><div class="n" style="margin-top:6px">64</div></div>
</div>
<div class="n" style="margin-top:8px">--space-1 … --space-16</div></body></html>
