<!-- @dsCard group="AAPM Layer Academy" viewport="1440x900" name="Academy workspace" subtitle="Login, dashboard, learning path, module detail and the admin learner console — click through" -->
<!doctype html><html lang="id"><head><meta charset="utf-8"><title>AAPM Layer Academy — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}a{color:var(--brand-green)}a:hover{color:var(--aapm-green-800)}button{font-family:inherit}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./academyData.js"></script>
<script type="text/babel" src="./LoginScreen.jsx"></script>
<script type="text/babel" src="./AcademyShell.jsx"></script>
<script type="text/babel" src="./AdminShell.jsx"></script>
<script type="text/babel" src="./DashboardScreen.jsx"></script>
<script type="text/babel" src="./LearningPathScreen.jsx"></script>
<script type="text/babel" src="./ModuleDetailScreen.jsx"></script>
<script type="text/babel" src="./AdminLearnersScreen.jsx"></script>
<script type="text/babel" data-presets="react">
const { StateView } = window.AAPMDesignSystem_07e1a3;
const adminViews = ["overview", "courses", "admin", "ai", "workspace"];
function App() {
  const [authed, setAuthed] = React.useState(false);
  const [view, setView] = React.useState("dashboard");
  if (!authed) return <window.LoginScreen onSignIn={() => setAuthed(true)} />;
  if (adminViews.includes(view)) return (
    <window.AdminShell view={view} onNavigate={setView} onExit={() => setView("dashboard")}>
      {view === "admin" && <window.AdminLearnersScreen />}
      {view !== "admin" && (
        <StateView state="empty" title="Layar admin ini tidak tersedia di sumber yang diberikan"
          description="Ringkasan, Manajemen course, Pengaturan AI dan Status ruang kerja ada di navigasi admin sumber, tetapi tidak dapat diaudit tanpa autentikasi — jadi tidak direkonstruksi di UI kit ini." />
      )}
    </window.AdminShell>
  );
  return (
    <window.AcademyShell view={view} onNavigate={setView} onAdmin={() => setView("admin")}>
      {view === "dashboard" && <window.DashboardScreen onOpenPath={() => setView("path")} onOpenModule={() => setView("module")} />}
      {view === "path" && <window.LearningPathScreen onOpenModule={() => setView("module")} />}
      {view === "module" && <window.ModuleDetailScreen onBack={() => setView("path")} />}
      {["calc","kpi","appi","profile","cert","exam"].includes(view) && (
        <StateView state="empty" title="Layar ini tidak tersedia di sumber yang diberikan"
          description="Halaman terautentikasi di luar Dashboard, Learning Path, Module Detail dan Panel Admin tidak dapat diaudit dari sumber yang tersedia, sehingga tidak direkonstruksi di UI kit ini." />
      )}
    </window.AcademyShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
