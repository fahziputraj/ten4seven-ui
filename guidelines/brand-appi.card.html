<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.st{padding:10px;border-radius:var(--radius-panel);border:1px solid var(--surface-border);background:var(--card);text-align:center}
.pair{position:relative;height:56px;display:flex;align-items:center;justify-content:center}
.pair img.f{height:46px;width:46px}
.pair img.d{position:absolute;top:-2px;right:14px;height:20px;width:20px}
.nm{margin-top:6px;font-size:var(--text-xs);font-weight:600}
.lb{margin-top:2px;font-size:var(--text-2xs);color:var(--muted-foreground)}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground);margin:14px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row img{height:34px;width:34px;border-radius:99px;background:var(--surface-muted)}
</style></head><body>
<div class="grid">
<div class="st"><div class="pair"><img class="f" src="../assets/appi/face-01.svg" alt=""><img class="d" src="../assets/appi/decor-01.svg" alt=""></div><div class="nm">idle</div><div class="lb">siap membantu</div></div>
<div class="st"><div class="pair"><img class="f" src="../assets/appi/face-05.svg" alt=""><img class="d" src="../assets/appi/decor-05.svg" alt=""></div><div class="nm">thinking</div><div class="lb">menelaah konteks</div></div>
<div class="st"><div class="pair"><img class="f" src="../assets/appi/face-08.svg" alt=""><img class="d" src="../assets/appi/decor-08.svg" alt=""></div><div class="nm">responding</div><div class="lb">menyusun jawaban</div></div>
<div class="st"><div class="pair"><img class="f" src="../assets/appi/face-09.svg" alt=""><img class="d" src="../assets/appi/decor-09.svg" alt=""></div><div class="nm">complete</div><div class="lb">jawaban selesai</div></div>
<div class="st"><div class="pair"><img class="f" src="../assets/appi/face-04.svg" alt=""><img class="d" src="../assets/appi/decor-04.svg" alt=""></div><div class="nm">success</div><div class="lb">berhasil membantu</div></div>
<div class="st"><div class="pair"><img class="f" src="../assets/appi/face-11.svg" alt=""><img class="d" src="../assets/appi/decor-11.svg" alt=""></div><div class="nm">alert</div><div class="lb">perlu perhatian</div></div>
</div>
<div class="cap">All 12 frames · face + decor pairs, cycled per state</div>
<div class="row">
<img src="../assets/appi/face-01.svg" alt=""><img src="../assets/appi/face-02.svg" alt=""><img src="../assets/appi/face-03.svg" alt=""><img src="../assets/appi/face-04.svg" alt=""><img src="../assets/appi/face-05.svg" alt=""><img src="../assets/appi/face-06.svg" alt=""><img src="../assets/appi/face-07.svg" alt=""><img src="../assets/appi/face-08.svg" alt=""><img src="../assets/appi/face-09.svg" alt=""><img src="../assets/appi/face-10.svg" alt=""><img src="../assets/appi/face-11.svg" alt=""><img src="../assets/appi/face-12.svg" alt="">

<img src="../assets/appi/decor-01.svg" alt=""><img src="../assets/appi/decor-02.svg" alt=""><img src="../assets/appi/decor-03.svg" alt=""><img src="../assets/appi/decor-04.svg" alt=""><img src="../assets/appi/decor-05.svg" alt=""><img src="../assets/appi/decor-06.svg" alt=""><img src="../assets/appi/decor-07.svg" alt=""><img src="../assets/appi/decor-08.svg" alt=""><img src="../assets/appi/decor-09.svg" alt=""><img src="../assets/appi/decor-10.svg" alt=""><img src="../assets/appi/decor-11.svg" alt=""><img src="../assets/appi/decor-12.svg" alt="">
</div>
</body></html>
