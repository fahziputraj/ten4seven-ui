<!-- @dsCard group="Brand" viewport="700x180" name="Interaction states" subtitle="Hover darkens, press nudges 1px, focus is a 3px lime glow with a green border" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)">
<div><div style="height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-control);background:var(--primary);color:#fff;font-weight:600;font-size:var(--text-base);transform:none;box-shadow:none">Submit</div><div class="n">rest</div></div><div><div style="height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-control);background:hsl(var(--primary-hsl) / .9);color:#fff;font-weight:600;font-size:var(--text-base);transform:none;box-shadow:none">Submit</div><div class="n">hover</div></div><div><div style="height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-control);background:hsl(var(--primary-hsl) / .9);color:#fff;font-weight:600;font-size:var(--text-base);transform:translateY(1px);box-shadow:none">Submit</div><div class="n">press</div></div><div><div style="height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-control);background:var(--primary);color:#fff;font-weight:600;font-size:var(--text-base);transform:none;box-shadow:var(--focus-ring)">Submit</div><div class="n">focus</div></div>
</div>
<div class="g" style="grid-template-columns:1fr 1fr;margin-top:14px">
<div><div style="height:44px;display:flex;align-items:center;padding:0 12px;border-radius:var(--radius-control);border:1px solid var(--input);background:var(--surface-elevated);color:var(--muted-foreground);font-size:var(--text-base)">you@example.com</div><div class="n">input · rest</div></div>
<div><div style="height:44px;display:flex;align-items:center;padding:0 12px;border-radius:var(--radius-control);border:1px solid var(--border-focus);background:var(--card);box-shadow:var(--focus-ring);font-size:var(--text-base)">you@example.com</div><div class="n">input · focus-within</div></div>
</div></body></html>
