<!-- @dsCard group="Colors" viewport="700x140" name="Brand core" subtitle="The whole identity: one green, one lime, one terracotta, one ink" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)">
<div><div class="sw" style="height:56px;background:var(--brand-green)"></div><div class="n">brand-green</div><div class="v">#318139</div></div>
<div><div class="sw" style="height:56px;background:var(--brand-lime)"></div><div class="n">brand-lime</div><div class="v">hsl(77 100% 47%)</div></div>
<div><div class="sw" style="height:56px;background:var(--brand-orange)"></div><div class="n">brand-orange</div><div class="v">#d4451a</div></div>
<div><div class="sw" style="height:56px;background:var(--aapm-ink)"></div><div class="n">foreground / ink</div><div class="v">hsl(145 38% 13%)</div></div>
<div><div class="sw" style="height:56px;background:var(--aapm-paper)"></div><div class="n">background</div><div class="v">#ffffff</div></div>
</div></body></html>
