<!-- @dsCard group="Spacing" viewport="700x150" name="Radius scale" subtitle="Larger than typical admin UI — cards are 20px, controls 12px" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:repeat(7,1fr)">
<div><div style="height:58px;border:1px solid var(--surface-border);background:var(--surface-subtle);border-radius:10px"></div><div class="n">radius-sm</div><div class="v">10px</div></div><div><div style="height:58px;border:1px solid var(--surface-border);background:var(--surface-subtle);border-radius:12px"></div><div class="n">radius-control</div><div class="v">12px</div></div><div><div style="height:58px;border:1px solid var(--surface-border);background:var(--surface-subtle);border-radius:14px"></div><div class="n">radius-md</div><div class="v">14px</div></div><div><div style="height:58px;border:1px solid var(--surface-border);background:var(--surface-subtle);border-radius:16px"></div><div class="n">radius-panel</div><div class="v">16px</div></div><div><div style="height:58px;border:1px solid var(--surface-border);background:var(--surface-subtle);border-radius:20px"></div><div class="n">radius-lg / card</div><div class="v">20px</div></div><div><div style="height:58px;border:1px solid var(--surface-border);background:var(--surface-subtle);border-radius:24px"></div><div class="n">radius-shell</div><div class="v">24px</div></div><div><div style="height:58px;border:1px solid var(--surface-border);background:var(--surface-subtle);border-radius:9999px"></div><div class="n">radius-full</div><div class="v">9999</div></div>
</div></body></html>
