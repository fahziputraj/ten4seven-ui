<!-- @dsCard group="Colors" viewport="700x190" name="Record lifecycle" subtitle="Sixteen canonical states map onto exactly five colours" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)">
<div><div class="sw" style="height:42px;background:var(--state-neutral)"></div><div class="n">state-neutral</div><div class="v">draft · closed · cancelled · inactive · archived</div></div>
<div><div class="sw" style="height:42px;background:var(--state-progress)"></div><div class="n">state-progress</div><div class="v">pending · submitted · revised</div></div>
<div><div class="sw" style="height:42px;background:var(--state-review)"></div><div class="n">state-review</div><div class="v">in review</div></div>
<div><div class="sw" style="height:42px;background:var(--state-approved)"></div><div class="n">state-approved</div><div class="v">verified · approved · completed</div></div>
<div><div class="sw" style="height:42px;background:var(--state-blocked)"></div><div class="n">state-blocked</div><div class="v">rejected · overdue · blocked · failed</div></div>
</div>
<div class="f" style="margin-top:12px;flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-full);padding:3px 10px;background:hsl(var(--state-neutral-hsl) / .1);color:var(--state-neutral);font-size:var(--text-sm);font-weight:600"><span style="height:6px;width:6px;border-radius:99px;background:currentColor"></span>Draft</span><span style="display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-full);padding:3px 10px;background:hsl(var(--state-progress-hsl) / .1);color:var(--state-progress);font-size:var(--text-sm);font-weight:600"><span style="height:6px;width:6px;border-radius:99px;background:currentColor"></span>Submitted</span><span style="display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-full);padding:3px 10px;background:hsl(var(--state-review-hsl) / .1);color:var(--state-review);font-size:var(--text-sm);font-weight:600"><span style="height:6px;width:6px;border-radius:99px;background:currentColor"></span>In review</span><span style="display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-full);padding:3px 10px;background:hsl(var(--state-approved-hsl) / .1);color:var(--state-approved);font-size:var(--text-sm);font-weight:600"><span style="height:6px;width:6px;border-radius:99px;background:currentColor"></span>Verified</span><span style="display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-full);padding:3px 10px;background:hsl(var(--state-approved-hsl) / .1);color:var(--state-approved);font-size:var(--text-sm);font-weight:600"><span style="height:6px;width:6px;border-radius:99px;background:currentColor"></span>Approved</span><span style="display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-full);padding:3px 10px;background:hsl(var(--state-blocked-hsl) / .1);color:var(--state-blocked);font-size:var(--text-sm);font-weight:600"><span style="height:6px;width:6px;border-radius:99px;background:currentColor"></span>Rejected</span><span style="display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-full);padding:3px 10px;background:hsl(var(--state-blocked-hsl) / .1);color:var(--state-blocked);font-size:var(--text-sm);font-weight:600"><span style="height:6px;width:6px;border-radius:99px;background:currentColor"></span>Overdue</span><span style="display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-full);padding:3px 10px;background:hsl(var(--state-neutral-hsl) / .1);color:var(--state-neutral);font-size:var(--text-sm);font-weight:600"><span style="height:6px;width:6px;border-radius:99px;background:currentColor"></span>Closed</span>
</div></body></html>
