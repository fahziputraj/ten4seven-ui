<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{display:grid;grid-template-columns:1fr 316px;width:1280px;height:854px}
.mark{display:flex;align-items:center;justify-content:center;background:var(--aapm-green-700)}
.mark img{width:52%;height:auto}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip span{display:block}
</style></head><body>
<div class="tile">
<div class="mark"><img src="assets/logos/aapm-icon-dark.svg" alt="AAPM"></div>
<div class="strip"><span style="background:var(--aapm-lime-500)"></span><span style="background:var(--aapm-orange-700)"></span><span style="background:var(--aapm-green-800)"></span><span style="background:var(--aapm-green-950)"></span></div>
</div></body></html>
