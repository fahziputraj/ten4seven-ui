<!-- @dsCard group="Brand" viewport="700x200" name="Icon language" subtitle="Solar via Iconify — bold-duotone for objects, bold for status, linear for chevrons" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="cap">Actions · bold</div>
<div class="f" style="margin:6px 0 12px;gap:14px;color:var(--foreground)">
<iconify-icon icon="solar:add-circle-bold" width="22"></iconify-icon><iconify-icon icon="solar:pen-new-square-bold" width="22"></iconify-icon><iconify-icon icon="solar:trash-bin-trash-bold" width="22"></iconify-icon><iconify-icon icon="solar:check-circle-bold" width="22"></iconify-icon><iconify-icon icon="solar:close-circle-bold" width="22"></iconify-icon><iconify-icon icon="solar:verified-check-bold" width="22"></iconify-icon><iconify-icon icon="solar:upload-minimalistic-bold" width="22"></iconify-icon><iconify-icon icon="solar:download-minimalistic-bold" width="22"></iconify-icon><iconify-icon icon="solar:share-bold" width="22"></iconify-icon><iconify-icon icon="solar:menu-dots-bold" width="22"></iconify-icon>
</div>
<div class="cap">Domain · bold-duotone</div>
<div class="f" style="margin:6px 0 12px;gap:14px;color:var(--brand-green)">
<iconify-icon icon="solar:home-add-bold-duotone" width="24"></iconify-icon><iconify-icon icon="solar:users-group-two-rounded-bold-duotone" width="24"></iconify-icon><iconify-icon icon="solar:bag-4-bold-duotone" width="24"></iconify-icon><iconify-icon icon="solar:syringe-bold-duotone" width="24"></iconify-icon><iconify-icon icon="solar:box-bold-duotone" width="24"></iconify-icon><iconify-icon icon="solar:transfer-horizontal-bold-duotone" width="24"></iconify-icon><iconify-icon icon="solar:bus-bold-duotone" width="24"></iconify-icon><iconify-icon icon="solar:wallet-money-bold-duotone" width="24"></iconify-icon><iconify-icon icon="solar:bill-list-bold-duotone" width="24"></iconify-icon><iconify-icon icon="ph:factory-duotone" width="24"></iconify-icon>
</div>
<div class="cap">Status · semantic colour</div>
<div class="f" style="margin:6px 0 12px;gap:14px">
<iconify-icon icon="solar:check-circle-bold" width="20" style="color:var(--success)"></iconify-icon>
<iconify-icon icon="solar:danger-triangle-bold" width="20" style="color:var(--warning)"></iconify-icon>
<iconify-icon icon="solar:danger-circle-bold" width="20" style="color:var(--danger)"></iconify-icon>
<iconify-icon icon="solar:info-circle-bold" width="20" style="color:var(--info)"></iconify-icon>
<iconify-icon icon="solar:clock-circle-bold" width="20" style="color:var(--state-neutral)"></iconify-icon>
<iconify-icon icon="solar:cpu-bolt-bold-duotone" width="20" style="color:var(--ai)"></iconify-icon>
<span style="width:10px"></span>
<iconify-icon icon="solar:alt-arrow-left-linear" width="18" style="color:var(--muted-foreground)"></iconify-icon>
<iconify-icon icon="solar:alt-arrow-right-linear" width="18" style="color:var(--muted-foreground)"></iconify-icon>
<iconify-icon icon="solar:alt-arrow-down-linear" width="18" style="color:var(--muted-foreground)"></iconify-icon>
<span class="n" style="margin:0">chevrons · linear</span>
</div>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script></body></html>
