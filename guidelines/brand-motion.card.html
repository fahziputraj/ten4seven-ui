<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="Three classes, two easings — motion explains change and never delays work" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:var(--text-base)}
.g{display:grid;gap:8px}.f{display:flex;gap:8px}.sw{border-radius:var(--radius-control);border:1px solid hsl(var(--foreground-hsl) / .07)}
.n{font-size:var(--text-2xs);font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);margin-top:5px}
.v{font-size:var(--text-2xs);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:.8}
.cap{font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body><div class="g" style="grid-template-columns:repeat(3,1fr)">
<div style="padding:12px;border-radius:var(--radius-panel);border:1px solid var(--surface-border);background:var(--card)">
  <div style="font-size:var(--text-lg);font-weight:600;letter-spacing:var(--tracking-title);font-variant-numeric:tabular-nums">150ms</div>
  <div style="font-size:var(--text-sm);font-weight:600;color:var(--brand-green)">Micro</div>
  <div class="n">colour · border · focus</div></div><div style="padding:12px;border-radius:var(--radius-panel);border:1px solid var(--surface-border);background:var(--card)">
  <div style="font-size:var(--text-lg);font-weight:600;letter-spacing:var(--tracking-title);font-variant-numeric:tabular-nums">200ms</div>
  <div style="font-size:var(--text-sm);font-weight:600;color:var(--brand-green)">Standard</div>
  <div class="n">hover lift · accordion</div></div><div style="padding:12px;border-radius:var(--radius-panel);border:1px solid var(--surface-border);background:var(--card)">
  <div style="font-size:var(--text-lg);font-weight:600;letter-spacing:var(--tracking-title);font-variant-numeric:tabular-nums">350ms</div>
  <div style="font-size:var(--text-sm);font-weight:600;color:var(--brand-green)">Large</div>
  <div class="n">drawer · modal · chart</div></div>
</div>
<div class="n" style="margin-top:10px;font-family:var(--font-mono);font-size:10px">--ease-out cubic-bezier(.22,1,.36,1) &nbsp;·&nbsp; --ease-emphasis cubic-bezier(.16,1,.3,1) &nbsp;·&nbsp; lift −2px &nbsp;·&nbsp; press +1px</div></body></html>
